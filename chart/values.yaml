
# Put here the ID of dataset you are going to work with (you can put more than one separated by comas):
datasetsList: ""

# Put here the code of the project and subproject where you want to upload the results of the ETL process:
projectCode: ""
subprojectCode: ""
# You can see the code of your project and subproject in the details web page: 
# https://eucaim-node.i3m.upv.es/dataset-service/projects
# Select your project in the list to access the details and ensure you are logged in to see the subprojects.

# ======= ADVANCED PARAMETERS (usually you don't need to change them)
nifi:
  image:
    repository: harbor.eucaim-node.i3m.upv.es:5000/library/etl/nifi-etl
    tag: "2.3.0-1"
  service:
    port: 8443
  credentials:
    username: eucaim
    password: ""   # leave empty to generate a random one
  localIp: "127.0.0.1"
  # true pulls the mapping of every dataset in datasetsList from
  # github.com/EUCAIM/etl-mappings on each start. false uses the ones in the shared folder
  downloadFlows: "false"
sharedDb:
  # host, user and password come from the shared-sql-db-auth secret
  port: "5432"
nifiRegistry:
  image:
    repository: harbor.eucaim-node.i3m.upv.es:5000/dockerhub/apache/nifi-registry
    tag: "2.3.0"
    pullPolicy: IfNotPresent
  service:
    port: 18080
postgresql:
  # the flows use the database of the project (shared-sql-db-auth), this one is
  # only deployed when explicitly enabled
  enabled: false
  image:
    repository: harbor.eucaim-node.i3m.upv.es:5000/library/etl/postgres-etl
    tag: "15-4"
  user: postgres
  password: postgres
  database: eucaim-etl-db
tdc:
  image: 
    repository: harbor.eucaim-node.i3m.upv.es:5000/library/etl/tdc-app
    tag: "1.1-slim"
    pullPolicy: IfNotPresent
  service:
    port: 5000
  containerPort: 5000
desktop:
  image:
    repository: harbor.eucaim-node.i3m.upv.es:5000/library/etl/desktop
    tag: "1.5"
