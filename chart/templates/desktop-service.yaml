apiVersion: v1
kind: Service
metadata:
    name: "{{ include "nifi.name" . }}-desktop"
spec:
    selector:
        app: "{{ include "nifi.name" . }}-desktop"
    type: ClusterIP
    ports:
    - name: sshd-svc
      port: 2222
      targetPort: sshd
    - name: vnc-gui-svc
      port: 5900
      targetPort: vnc-gui
