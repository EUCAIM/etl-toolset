name: Test NiFi environment and pipelines

on:
  push:
    branches:
      - develop
      - Local_Node
  pull_request:
    branches:
      - develop
      - Local_Node

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # CI covers every dataset the tests know about, unlike a real deployment,
      # where the operator selects only the ones the node serves
      - name: Select datasets under test
        run: |
          DATASETS=$(tail -n +2 scripts/config.csv | cut -d',' -f2 | tr -d '\r' | paste -sd, -)
          if [ -z "$DATASETS" ]; then
            echo "No dataset found in scripts/config.csv"
            exit 1
          fi
          echo "Datasets under test: $DATASETS"
          echo "datasetsList=$DATASETS" >> "$GITHUB_ENV"

      - name: Launch environment
        run: ./startup.sh

      - name: Waiting for nifi pipelines full initialization
        run: |
          CONTAINER=$(docker compose ps -q nifi)

          echo "Waiting for: init.sh"

          until docker exec $CONTAINER sh -c '[ -f /tmp/init_done ]'; do
            echo "Not ready yet..."
            sleep 5
          done

          echo "Init complete ✅"

      - name: Run tests
        run: ./scripts/run_test.sh

      - name: Clean environment
        if: always()
        run: docker compose down -v