name: Sync Repos develop branch

on:
  push:
    branches:
      - develop

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v5
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PAT }}

      - name: Add Gitea to known_hosts
        run: |
          ssh-keyscan -p 222 scm.cloud-bahiasoftware.es >> ~/.ssh/known_hosts
      - name: Push to destination repository
        run: |
          git config --global user.email "francisco.castro@bahiasoftware.es"
          git config --global user.name "fcasnun"
          git clone https://scm.cloud-bahiasoftware.es/rpalpal/Eucaim_ETL.git
          cd Eucaim_ETL
          git remote add https://scm.cloud-bahiasoftware.es/rpalpal/Eucaim_ETL.git
          git remote update
          git checkout develop
          git merge ${{ env.ORIGINAL_REPO_NAME }}/develop
          git push origin develop
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
          ORIGINAL_REPO_NAME: etl-toolset
          ORG_NAME: EUCAIM
          REMOTE_ORG_NAME : rpalpal
